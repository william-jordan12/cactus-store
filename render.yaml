services:
  - type: web
    name: cactus-store
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PORT
        value: 10000
      - key: VITE_CLOUDINARY_CLOUD_NAME
        value: tmojnrbp
      - key: VITE_CLOUDINARY_UPLOAD_PRESET
        value: Cactus
